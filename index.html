<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4332">
<meta name="description" content="e-SIM Wali Asuh SR — sistem informasi manajemen wali asuh Sekolah Rakyat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>e-SIM Wali Asuh SR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <!-- Navigasi samping (hanya Koordinator/Admin; di HP menjadi bilah bawah) -->
  <nav class="side" id="side" aria-label="Menu panel"></nav>
  <div class="col">
    <header class="hdr" id="hdr" hidden>
      <div class="logo" aria-hidden="true"><span class="ms">diversity_3</span></div>
      <div class="brand"><b>e-SIM Wali Asuh SR</b><small id="brand-s">Sekolah Rakyat</small></div>
      <button class="ib" data-act="bell" aria-label="Pemberitahuan"><span class="ms">notifications</span><span class="dot" id="bell-dot" hidden></span></button>
      <button class="av" id="av" data-act="avatar" aria-label="Akun saya">?</button>
    </header>
    <div id="banner" class="alert" hidden style="margin:8px 16px 0"></div>
    <main id="main">
      <section class="view" id="v-login" aria-label="Masuk"></section>
      <section class="view" id="v-ganti" aria-label="Ganti kata sandi"></section>
      <section class="view" id="v-beranda" aria-label="Beranda"></section>
      <section class="view" id="v-siswa" aria-label="Siswa"></section>
      <section class="view" id="v-detail" aria-label="Detail siswa"></section>
      <section class="view" id="v-absensi" aria-label="Absensi"></section>
      <section class="view" id="v-kunjungan" aria-label="Kunjungan khusus"></section>
      <section class="view" id="v-bimbingan" aria-label="Bimbingan"></section>
      <section class="view" id="v-bform" aria-label="Catat bimbingan"></section>
      <section class="view" id="v-lainnya" aria-label="Lainnya"></section>
      <section class="view" id="v-laporan" aria-label="Laporan"></section>
      <section class="view" id="v-perhatian" aria-label="Perlu perhatian"></section>
      <section class="view" id="v-p" aria-label="Panel"></section>
      <button class="fab" id="fab" data-act="newb" hidden><span class="ms">add</span>Catat TL Baru</button>
      <div id="splash" class="view on"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </main>
    <footer class="dock" id="dock" hidden>
      <div class="sync" id="sync"><span class="led"></span><span id="sync-t">Online</span><span class="sp"></span><span class="pill" id="sync-q" hidden>0 antre</span><button class="btn-s" data-act="syncnow" aria-label="Sinkronkan sekarang">Sinkron</button></div>
      <nav class="tabs" aria-label="Menu utama">
        <button class="tab on" data-go="beranda"><span class="ms">home</span>Beranda</button>
        <button class="tab" data-go="siswa"><span class="ms">groups</span>Siswa</button>
        <button class="tab" data-go="absensi"><span class="ms">how_to_reg</span>Absensi</button>
        <button class="tab" data-go="bimbingan"><span class="ms">forum</span>Bimbingan</button>
        <button class="tab" data-go="lainnya"><span class="ms">menu</span>Lainnya<span class="bdg" id="bdg-lain" hidden>0</span></button>
      </nav>
    </footer>
  </div>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
